[project]
name = "dvf-dpe-pays-basque"
version = "0.1.0"
description = "Croisement DVF x DPE sur le littoral Pays Basque + BAB elargi"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
# Genere la synthese PDF (pipeline/07_report.py) uniquement -- hors chemin de
# deploiement (site statique) et hors CI (aucun test n'importe 07_report).
# Groupe non-defaut : `uv sync --group report` pour l'installer.
# typst : moteur de mise en page + graphes (lilaq). Le paquet pip embarque le
# binaire et les polices -> pas d'install systeme. Version epinglee = PDF
# reproductible bit a bit (le producer PDF porte la version typst).
report = [
    "typst>=0.15,<0.16",
]
# Brique Jev (pipeline/04c_jev_disambiguate.py, spec #33) uniquement -- hors chemin
# de deploiement (le dashboard lit des verdicts DEJA calcules, jamais le modele) et
# hors CI (aucun test n'importe typesafe_sdk : le module pur n'a pas de reseau et le
# client est teste via un faux `ask`).
# Groupe non-defaut : `uv sync --group jev` pour l'installer.
# Version bornee : la forme de SystemOneResponse (.model / .answers / .usage) est
# celle que `jev_client.normalize_response` sait lire.
jev = [
    "typesafe-sdk>=0.7.1,<0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
