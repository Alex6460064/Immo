[project]
name = "dvf-dpe-pays-basque"
version = "0.1.0"
description = "Croisement DVF x DPE sur le littoral Pays Basque + BAB elargi"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "shapely>=2.0",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
# Genere la synthese PDF (pipeline/07_report.py) uniquement -- hors chemin de
# deploiement (dashboard Cloud) et hors CI (aucun test n'importe 07_report ni
# matplotlib). Groupe non-defaut : `uv sync --group report` pour l'installer.
report = [
    "matplotlib>=3.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
